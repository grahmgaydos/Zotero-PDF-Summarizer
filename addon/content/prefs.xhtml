<?xml version="1.0"?>
<vbox xmlns="http://www.w3.org/1999/xhtml"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="zotero-prefpane-pdf-auto-summariser"
      data-l10n-id="pas-prefs-title">

  <html:div class="pas-prefs">

    <html:fieldset>
      <html:legend data-l10n-id="pas-prefs-backend-label"/>

      <html:div class="pas-row">
        <html:label data-l10n-id="pas-prefs-backend-label" for="pas-backend"/>
        <html:select id="pas-backend"
                     data-preference="extensions.pdf-auto-summariser.backend">
          <html:option value="ollama" data-l10n-id="pas-prefs-backend-ollama"/>
          <html:option value="lmstudio" data-l10n-id="pas-prefs-backend-lmstudio"/>
          <html:option value="openai" data-l10n-id="pas-prefs-backend-openai"/>
          <html:option value="anthropic" data-l10n-id="pas-prefs-backend-anthropic"/>
        </html:select>
      </html:div>

      <html:div class="pas-row">
        <html:label data-l10n-id="pas-prefs-endpoint-label" for="pas-endpoint"/>
        <html:input type="text" id="pas-endpoint" size="60"
                    data-preference="extensions.pdf-auto-summariser.endpoint"/>
      </html:div>

      <html:div class="pas-row">
        <html:label data-l10n-id="pas-prefs-model-label" for="pas-model"/>
        <html:input type="text" id="pas-model" size="40"
                    data-preference="extensions.pdf-auto-summariser.model"/>
      </html:div>

      <html:div class="pas-row">
        <html:label data-l10n-id="pas-prefs-apikey-label" for="pas-apikey"/>
        <html:input type="password" id="pas-apikey" size="60"
                    data-preference="extensions.pdf-auto-summariser.apiKey"/>
      </html:div>
      <html:p class="pas-note" data-l10n-id="pas-prefs-apikey-note"/>

      <html:div class="pas-row">
        <html:button id="pas-test-btn" data-l10n-id="pas-prefs-test-button"/>
        <html:span id="pas-test-result" class="pas-note"/>
      </html:div>
    </html:fieldset>

    <html:fieldset>
      <html:legend>Behaviour</html:legend>

      <html:div class="pas-row">
        <html:input type="checkbox" id="pas-autoonadd"
                    data-preference="extensions.pdf-auto-summariser.autoOnAdd"/>
        <html:label for="pas-autoonadd" data-l10n-id="pas-prefs-autoonadd-label"/>
      </html:div>

      <html:div class="pas-row">
        <html:label data-l10n-id="pas-prefs-onexisting-label" for="pas-onexisting"/>
        <html:select id="pas-onexisting"
                     data-preference="extensions.pdf-auto-summariser.onExistingAbstract">
          <html:option value="skip" data-l10n-id="pas-prefs-onexisting-skip"/>
          <html:option value="ask" data-l10n-id="pas-prefs-onexisting-ask"/>
          <html:option value="overwrite" data-l10n-id="pas-prefs-onexisting-overwrite"/>
        </html:select>
      </html:div>

      <html:div class="pas-row">
        <html:label data-l10n-id="pas-prefs-maxchars-label" for="pas-maxchars"/>
        <html:input type="number" id="pas-maxchars" min="2000" max="200000" step="1000"
                    data-preference="extensions.pdf-auto-summariser.maxChars"/>
      </html:div>
    </html:fieldset>

    <html:fieldset>
      <html:legend data-l10n-id="pas-prefs-prompt-label"/>
      <html:textarea id="pas-prompt" rows="8" cols="80"
                     data-preference="extensions.pdf-auto-summariser.prompt"/>
    </html:fieldset>

  </html:div>

  <html:script src="chrome://pdf-auto-summariser/content/prefs-page.js"/>
</vbox>
